name: AI Video Catwalk Generator (Stable Video Diffusion)

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Path to dress image'
        required: false
        default: 'inputs/dress.jpg'
      motion:
        description: 'Motion intensity (1-255)'
        required: false
        default: '127'
  push:
    branches:
      - main

jobs:
  generate-ai-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gradio_client requests

      - name: Run AI Video Diffusion Generator
        run: |
          mkdir -p renders
          IMAGE_PATH="${{ github.event.inputs.image_path || 'inputs/dress.jpg' }}"
          MOTION="${{ github.event.inputs.motion || '127' }}"
          
          python3 ai_video_generator.py \
            --image "$IMAGE_PATH" \
            --motion "$MOTION" \
            --output renders/ai_dress_catwalk.mp4
            
          echo "Generated AI Video output:"
          ls -lh renders/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dress-catwalk-video
          path: renders/
          retention-days: 30
