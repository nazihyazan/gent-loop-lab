name: Advanced AI Video Generator (Wan 2.2 & SVD)

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Path to input garment photo'
        required: false
        default: 'inputs/dress.jpg'
      prompt:
        description: 'Text prompt describing the catwalk runway scene'
        required: false
        default: 'Fashion runway catwalk show, ghost mannequin wearing this Moroccan hooded jalaba walking forward down the runway, invisible void head, glossy reflective floor, dramatic fashion spotlights'
  push:
    branches:
      - main

jobs:
  generate-ai-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gradio_client requests

      - name: Run Wan 2.2 Advanced AI Video Generator
        run: |
          mkdir -p renders
          IMAGE_PATH="${{ github.event.inputs.image_path || 'inputs/dress.jpg' }}"
          PROMPT="${{ github.event.inputs.prompt || 'Fashion runway catwalk show, ghost mannequin wearing this Moroccan hooded jalaba walking forward down the runway, invisible void head, glossy reflective floor, dramatic fashion spotlights' }}"
          
          python3 ai_video_generator.py \
            --image "$IMAGE_PATH" \
            --prompt "$PROMPT" \
            --output renders/wan_ai_dress_catwalk.mp4
            
          echo "Generated AI Video output:"
          ls -lh renders/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-catwalk-video-wan
          path: renders/*.mp4
          retention-days: 30
