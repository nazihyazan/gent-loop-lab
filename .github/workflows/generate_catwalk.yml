name: Ghost Mannequin Catwalk Video Generator

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Path to dress image inside repository'
        required: false
        default: 'inputs/dress.jpg'
      dress_color:
        description: 'Dress accent color hex'
        required: false
        default: '#5c4046'
      frames:
        description: 'Total frames (120 frames = 5s, 240 frames = 10s)'
        required: false
        default: '120'
  push:
    paths:
      - 'inputs/**'
      - '.github/workflows/generate_catwalk.yml'

jobs:
  generate-catwalk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1

      - name: Install Blender 4.2 LTS
        run: |
          echo "Downloading official Blender 4.2.1 Linux portable package..."
          curl -sSL https://download.blender.org/release/Blender4.2/blender-4.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          sudo mv blender-4.2.1-linux-x64 /opt/blender
          sudo ln -s /opt/blender/blender /usr/local/bin/blender
          rm blender.tar.xz
          blender --version

      - name: Render Ghost Mannequin Catwalk Video
        run: |
          mkdir -p renders
          IMAGE_PATH="${{ github.event.inputs.image_path || 'inputs/dress.jpg' }}"
          COLOR="${{ github.event.inputs.dress_color || '#5c4046' }}"
          FRAMES="${{ github.event.inputs.frames || '120' }}"
          
          xvfb-run -a python3 catwalk_cli.py \
            --image "$IMAGE_PATH" \
            --color "$COLOR" \
            --frames "$FRAMES" \
            --output renders/ghost_mannequin_catwalk.mp4
          
          echo "Listing renders directory:"
          ls -lh renders/

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-mannequin-catwalk-video
          path: renders/
          retention-days: 30
